name: farmatod
description: "Consulta de stock y precios en tiempo real, mas inventario propio: vencimientos, deposito y conteo."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.0
  sqflite: ^2.4.3
  path: ^1.9.1
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A2540"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
