name: Mantener despierto el backend (Render)

# Le hace ping al endpoint de salud "/" (público, sin código de acceso)
# cada 5 minutos durante el horario de la farmacia, para que Render no
# lo duerma por inactividad -el plan gratis lo duerme tras ~15 min sin
# tráfico-. Limitado a esta ventana horaria (en vez de las 24 h del
# día) para no acercarnos al tope de 750 horas/mes del plan GRATIS DE
# RENDER (este workflow en sí no tiene costo ni límite práctico, al
# correr en un repositorio público de GitHub Actions).
#
# Horario configurado: 1pm a 11pm hora de Venezuela (UTC-4), todos los
# días -> 17:00 a 02:59 UTC. Para cambiarlo, edita la línea "cron" de
# abajo: las horas están en UTC, así que súmale 4 a la hora de
# Venezuela que quieras (ej. 8am VET = 12:00 UTC).
#
# Nota: GitHub no garantiza el minuto exacto en workflows programados
# -puede haber unos minutos de demora en momentos de mucha carga en
# GitHub-, pero es más que suficiente margen frente a los ~15 min que
# tarda Render en dormir el servicio.

on:
  schedule:
    - cron: '*/5 17-23,0-2 * * *'
  workflow_dispatch: {} # para probarlo a mano desde la pestaña "Actions" en GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al backend
        run: curl -sf --max-time 25 https://farmatod-backend.onrender.com/
